name: Crypto Autobot CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: crypto-autobot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bot
        uses: actions/checkout@v6
        with:
          path: crypto_autobot

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install strategy dependencies
        run: python3 -m pip install -r crypto_autobot/requirements-ml.txt

      - name: Run tests
        run: python3 -m unittest discover -s crypto_autobot/tests -v

      - name: Compile runtime
        run: |
          PYTHONPYCACHEPREFIX=/tmp/crypto-autobot-pycache \
            python3 -m py_compile crypto_autobot/*.py

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload static status page
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: crypto_autobot/github_pages

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deploy static status page
        id: deployment
        uses: actions/deploy-pages@v4
